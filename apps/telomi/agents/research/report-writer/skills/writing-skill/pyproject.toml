[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "writing-skill"
version = "0.1.0"
description = "Internal and external writing workflows with a deterministic Chinese prose lint CLI"
requires-python = ">=3.10"
license = "MIT"
authors = [{ name = "grapeot" }]
keywords = ["writing", "skill", "ai", "agent", "prose", "lint", "chinese"]
classifiers = [
    "Programming Language :: Python :: 3",
    "License :: OSI Approved :: MIT License",
    "Operating System :: OS Independent",
]

[project.optional-dependencies]
dev = [
    "pytest>=7",
]

[project.scripts]
# Prime 要求 console script 名与 import 名完全一致，helper 自己去找 run()。
writing_skill = "rlm.skill:cli"
external-prose-lint = "writing_skill.external_prose_lint_cli:main"

[tool.hatch.build.targets.wheel]
packages = ["src/writing_skill"]

[tool.pytest.ini_options]
testpaths = ["tests"]
