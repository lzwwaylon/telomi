schema_version: 2
id: report-writer
display_name: Report Writer Root
skills: [wiki-report, notes-report, writing-skill]
prompts:
  system-append:
    wiki: system.wiki.md.njk
    notes: system.notes.md.njk
    answer: system.answer.md.njk
  user:
    answer: user.answer.md.njk
    wiki-plan: user.wiki-plan.md.njk
    notes-plan: user.notes-plan.md.njk
    wiki-delegate: user.wiki-delegate.md.njk
    notes-delegate: user.notes-delegate.md.njk
    final: user.final.md.njk
    final-repair: user.final-repair.md.njk
    resume-context: user.resume-context.md.njk
    completed-sections: user.completed-sections.md.njk
# Production is intercepted by PrimeReportWriterStageRunner. This SRT policy is
# retained only for recorded Stage replay and generic Stage contract tests.
sandbox:
  role: report.report_writer
  execution_profile: pi_builtin
  network: allow
  tools: [read, write, edit, bash, ls, find, grep, wiki_search, wiki_read_page, wiki_graph_search, submit_stage_output]
