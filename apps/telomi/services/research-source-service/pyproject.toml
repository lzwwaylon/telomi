[build-system]
requires = ["hatchling>=1.27"]
build-backend = "hatchling.build"

[project]
name = "telomi-research-source-service"
version = "0.1.0"
license = "Apache-2.0"
description = "Authenticated FastAPI service for Telomi research sources and document parsing"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
  "beautifulsoup4>=4.13,<5",
  "docling==2.113.0",
  "fastapi==0.115.13",
  "httpx>=0.27,<1",
  "lxml>=6,<7",
  "markdownify>=1.1,<2",
  "openpyxl>=3.1,<4",
  "pydantic-settings>=2.7,<3",
  "python-docx>=1.1,<2",
  "python-pptx>=1.0,<2",
  "uvicorn[standard]>=0.34,<1",
  "xclienttransaction==1.0.3",
  "yt-dlp>=2026.8.19,<2027",
]

[project.optional-dependencies]
dev = [
  "pytest>=8.3,<10",
  "pytest-asyncio>=0.25,<2",
  "ruff>=0.11,<1",
]

[tool.hatch.build.targets.wheel]
packages = ["src/research_source_service"]

[tool.pytest.ini_options]
addopts = "-q"
asyncio_mode = "auto"
testpaths = ["tests"]

[tool.ruff]
line-length = 120
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "ASYNC", "RUF"]
# Chinese prose in comments, docstrings and user-facing messages uses fullwidth punctuation.
allowed-confusables = ["，", "：", "；", "（", "）"]
