name: Prepare deterministic checks
description: Node, uv, Linux sandbox dependencies, and the cached dependency and Python environments.
runs:
  using: composite
  steps:
    - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
      with:
        node-version-file: .nvmrc
        cache: npm
    - uses: astral-sh/setup-uv@bec219d24cd3e171d82865faccec33120bb574f4 # v10.1.0
      with:
        # The synced environments below are cached whole; uv's own download cache would only be saved again.
        enable-cache: false
    - name: Prepare Linux sandbox dependencies
      shell: bash
      run: |
        # The image ships toolchains this job never uses; node_modules and the two CUDA-bearing
        # Python environments otherwise leave the 72 GB disk about 97% full during the tests.
        sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/hostedtoolcache/CodeQL
        # Only Ubuntu packages are installed; the image's Microsoft source intermittently answers
        # 403, and apt-get update then fails the whole job before any test runs.
        sudo rm -f /etc/apt/sources.list.d/microsoft-*
        sudo apt-get update
        sudo apt-get install --yes bubblewrap socat ripgrep
        # SRT needs capability-bearing user namespaces on this disposable runner.
        sudo sysctl -w kernel.apparmor_restrict_unprivileged_userns=0
    - name: Restore npm ci output
      id: node-modules
      uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4.3.0
      with:
        path: |
          node_modules
          apps/*/node_modules
          apps/extensions/*/node_modules
        key: node-modules-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('.nvmrc', 'package-lock.json') }}
    - if: steps.node-modules.outputs.cache-hit != 'true'
      shell: bash
      run: npm ci
    - name: Restore uv-managed interpreters and the Prime kernel environment
      # The Hindsight and Research environments are not cached: their Linux lockfiles resolve CUDA
      # torch, several gigabytes that uv fetches in about half a minute but that would not fit the
      # repository cache quota alongside node_modules.
      uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4.3.0
      with:
        path: |
          ~/.local/share/uv/python
          apps/telomi/.prime-kernel
        key: python-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('apps/telomi/services/*/uv.lock', 'package-lock.json') }}
    - name: Prepare Hindsight, Research Python and Prime kernel
      # `uv sync --frozen` and the kernel readiness check are no-ops on a restored environment.
      shell: bash
      run: npm run setup
